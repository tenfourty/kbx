[project]
name = "kbx"
version = "0.1.63"
description = "Local knowledge base CLI — hybrid search over markdown files with AI embeddings"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Idris Kalmar"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
keywords = ["knowledge-base", "search", "embeddings", "markdown", "cli", "llm"]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jq>=1.8",
    "httpx>=0.27",
    "cryptography>=43.0",
    "pydantic>=2.6",
    "tomli>=2.0; python_version < '3.11'",
    "pycrdt>=0.12.47",
]

[project.optional-dependencies]
# Vector search (hybrid mode) — needed for `kb search` without --fast
# Works on Python 3.10+ Linux/Mac. Model weights in ~/.config/kbx/model/ are portable.
search = [
    "lancedb>=0.15",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "tokenizers>=0.15",
    "einops>=0.7",
]
#  MLX backend (Apple Silicon only) — faster embeddings via unified memory
mlx = [
    "mlx>=0.30",
    "transformers>=4.40",
]
#  MCP server
mcp = [
    "mcp>=1.2",
]
#  Full install (Mac dev): uv pip install -e ".[search,mlx,mcp,test,dev]"
all = [
    "kbx[search,mlx,mcp,test,dev]",
]
test = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.0", "pytest-xdist>=3.5"]
dev = ["ruff>=0.8", "mypy>=1.13", "pre-commit>=4.0", "types-PyYAML>=6.0", "bandit>=1.7"]

[project.scripts]
kbx = "kb.cli:cli"
kb = "kb.cli:cli"

[project.urls]
Repository = "https://github.com/tenfourty/kbx"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",    #  pycodestyle errors
    "F",    #  pyflakes
    "W",    #  pycodestyle warnings
    "I",    #  isort
    "UP",   # pyupgrade
    "B",    #  bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ANN",  # type annotations
    "TC",   # TYPE_CHECKING imports
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "SIM108", # ternary operator (readability)
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "TC"]
"src/kb/cli.py" = ["E402"]  # proxy stripping must run before imports

[tool.ruff.lint.isort]
known-first-party = ["kb"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["kb"]
strict = true

[[tool.mypy.overrides]]
module = ["lancedb.*", "sentence_transformers.*", "pyarrow.*", "einops.*", "jq.*", "mcp.*", "numpy.*", "torch.*", "rich.*", "httpx.*", "mlx.*", "pydantic.*", "tomli.*", "pycrdt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# MLX model loader: nested nn.Module classes with locally-imported mlx.nn
# are fundamentally uncheckable — mlx has incomplete stubs.
module = ["kb.mlx_backend"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "slow: marks tests that load real ML models or scan large directories (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
    #  Third-party deprecations we can't fix
    "ignore::DeprecationWarning:lancedb.*",
    "ignore::DeprecationWarning:pyarrow.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:sentence_transformers.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::FutureWarning:lancedb.*",
    "ignore::FutureWarning:pyarrow.*",
    "ignore::DeprecationWarning:importlib._bootstrap.*",
    "ignore::DeprecationWarning:importlib_metadata.*",
    #  SWIG bindings (jq) — no __module__ attribute on builtin types
    "ignore:builtin type .* has no __module__:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/kb"]
omit = ["src/kb/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",  # assert_used — internal invariants, not security-relevant
    "B110",  # try_except_pass — intentional cleanup (MPS/Metal cache clear)
    "B112",  # try_except_continue — FTS5 syntax fallback by design
    "B404",  # import_subprocess — used for organise_granola only
    "B603",  # subprocess_without_shell — safe: no shell, fixed args
    "B608",  # hardcoded_sql_expressions — f-string SQL with validated identifiers
]
