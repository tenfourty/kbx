name: PyPI drift check

# Option C of issue #103: daily compare the latest GitHub release tag to the
# latest published PyPI version. When they diverge, open a tracking issue;
# when they reconverge, close any open drift issues automatically.
#
# Motivation: Mode E of the CI reliability investigation (kbx#102) revealed
# that eight releases between 0.2.0 and 0.2.7 silently never published to
# PyPI — release-please cut tags, the publish step failed Trusted-Publisher
# token exchange, and nobody noticed for three weeks because the failure
# only surfaced in a single matrix job log. This workflow tests the
# invariant directly: latest tag should match latest PyPI version.

on:
  schedule:
    # Daily at 12:00 UTC — chosen so the run lands well after release-please
    # has had time to cut + publish any same-day release.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

env:
  # All untrusted inputs (release tags, PyPI versions) are routed through
  # env vars and quoted in shell, never inlined into `run:` via ${{ }}.
  # The search string is constant so we don't need to escape it.
  DRIFT_ISSUE_QUERY: "PyPI drift detected in:title"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
    steps:
      - name: Resolve latest GitHub release tag
        id: gh
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name')
          # Strip release-please-style prefixes (kbx-v0.2.8 → 0.2.8, v1.2.3 → 1.2.3, kbx-0.2.8 → 0.2.8)
          VERSION="$TAG"
          VERSION="${VERSION#kbx-v}"
          VERSION="${VERSION#kbx-}"
          VERSION="${VERSION#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest GitHub: $TAG (parsed as $VERSION)"

      - name: Resolve latest PyPI version
        id: pypi
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL "https://pypi.org/pypi/kbx/json" | jq -r '.info.version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest PyPI: $VERSION"

      - name: Compare + open / close drift issue
        env:
          # Route step outputs through env so they're shell-quoted, not
          # template-substituted into the script body. Prevents injection
          # from a maliciously-crafted release tag like `0.0; rm -rf /`.
          GH_TAG: ${{ steps.gh.outputs.tag }}
          GH_VERSION: ${{ steps.gh.outputs.version }}
          PYPI_VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$GH_VERSION" = "$PYPI_VERSION" ]; then
            echo "::notice::Versions in sync (GitHub=$GH_VERSION, PyPI=$PYPI_VERSION)."
            # Auto-close any open drift issues.
            gh issue list --repo "$REPO" --state open \
              --search "$DRIFT_ISSUE_QUERY" --json number --jq '.[].number' \
              | while read -r NUM; do
                echo "Closing reconverged drift issue #$NUM."
                CLOSE_BODY="Versions reconverged: GitHub=\`${GH_TAG}\` (\`${GH_VERSION}\`), PyPI=\`${PYPI_VERSION}\`. Closing automatically."
                gh issue close "$NUM" --repo "$REPO" --comment "$CLOSE_BODY"
              done
            exit 0
          fi

          echo "::error::Version drift detected: GitHub=$GH_VERSION ($GH_TAG), PyPI=$PYPI_VERSION"

          # Don't open duplicates if a drift issue is already open.
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "$DRIFT_ISSUE_QUERY" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Drift issue #$EXISTING already open — skipping creation."
            exit 1
          fi

          ACTIONS_URL="${SERVER_URL}/${REPO}/actions/workflows/ci.yml"
          TITLE="ci: PyPI drift detected (GitHub ${GH_VERSION} != PyPI ${PYPI_VERSION})"
          BODY=$(printf '%s\n' \
            "Automated drift detection caught a mismatch between the latest GitHub release and the latest PyPI version." \
            "" \
            "- **Latest GitHub release**: \`${GH_TAG}\` (version \`${GH_VERSION}\`)" \
            "- **Latest PyPI version**: \`${PYPI_VERSION}\`" \
            "" \
            "Likely cause: a failed \`publish\` job for one or more recent releases. Common fixes:" \
            "" \
            "1. **Re-run the publish job** on the affected release commit ([recent workflow runs](${ACTIONS_URL}))." \
            "2. **Check PyPI Trusted Publisher config** matches the current workflow filename ([pypi.org/manage/project/kbx/settings/publishing/](https://pypi.org/manage/project/kbx/settings/publishing/)). Renaming a workflow file silently breaks the token exchange — that's how Mode E of kbx#102 surfaced." \
            "" \
            "This issue will be closed automatically when the versions reconverge.")
          gh issue create --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "ci"
          exit 1
