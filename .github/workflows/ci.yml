name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra search --extra mcp --extra test --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Security scan
        run: uv run bandit -c pyproject.toml -r src/

      - name: Test
        run: uv run pytest -x -q --cov --cov-fail-under=90 -m "not slow"

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4.4.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Keep uv.lock in lockstep with the version release-please writes into
      # pyproject.toml. Without this the lock lags by a release, and the next
      # commit's pre-commit `uv run` re-syncs it mid-hook and aborts the commit.
      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.pr
        with:
          python-version: "3.12"

      - name: Sync uv.lock on the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          BRANCH=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)
          git clone --branch "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" rp-sync
          cd rp-sync
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock to release version"
            git push
          fi

      - name: Enable auto-merge on release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          gh pr merge "$PR_NUMBER" --auto --squash --repo "${{ github.repository }}"

  publish:
    needs: [check, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      pull-requests: write  # so the failure-notification step can comment
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Option A of issue #103: surface publish failures on the just-merged
      # release-please PR so the drift can't sit silent. Pairs with the
      # cron-based drift check (Option C) in .github/workflows/pypi-drift-check.yml.
      - name: Notify release PR on publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SHORT_SHA="${COMMIT_SHA:0:7}"
          PR=$(gh pr list --repo "$REPO" --state merged \
              --search "in:title chore(main): release" --limit 1 \
              --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            BODY=":warning: **Publish to PyPI failed** for [\`${SHORT_SHA}\`](${SERVER_URL}/${REPO}/commit/${COMMIT_SHA}). See the [failed workflow run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}). Re-run the publish job or check PyPI Trusted Publisher config."
            gh pr comment "$PR" --repo "$REPO" --body "$BODY"
          else
            echo "::warning::Publish failed but no recent release PR found to comment on."
          fi
