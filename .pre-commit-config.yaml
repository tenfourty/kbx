repos:
  - repo: https://github.com/GitGuardian/ggshield
    rev: v1.52.2
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r src/
        language: system
        types: [python]
        pass_filenames: false
      - id: tests
        name: pytest
        entry: uv run pytest tests/ -x -q --cov --cov-fail-under=90 -m "not slow"
        language: system
        pass_filenames: false
        always_run: true
      - id: uv-lock-registry
        name: uv.lock public-index guard
        entry: scripts/check-uv-lock-registry.sh
        language: system
        files: ^uv\.lock$
        pass_filenames: false
      - id: pii-denylist
        name: PII denylist scan
        entry: python3 scripts/pii-scan.py
        language: system
        exclude: '^.*\.(png|jpg|jpeg|gif|ico|woff2?|pdf)$'
      - id: ruff-check-pre-push
        name: ruff check (pre-push)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format-pre-push
        name: ruff format check (pre-push)
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
